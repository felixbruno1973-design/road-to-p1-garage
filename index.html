<body>

<script>
(function(){
'use strict';
var frame=document.getElementById('garageFrame');
var boot=document.getElementById('boot');
var KEY='roadToP1GarageV107';
var BOX_META={
 'pieces-lara':['PIÈCES LARA','Lara','Pièces diverses',28,'check'],
 'pieces-aaron':['PIÈCES AARON','Aaron','Pièces diverses',31,'check'],
 'equip-lara':['ÉQUIPEMENTS LARA','Lara','Équipements pilote',42,'ok'],
 'equip-aaron':['ÉQUIPEMENTS AARON','Aaron','Équipements pilote',38,'check'],
 'pieces-detachees':['PIÈCES DÉTACHÉES','Commun','Stock pièces détachées',56,'check'],
 'outils-pneumatiques':['OUTILS PNEUMATIQUES','Commun','Outils pneumatiques',24,'ok'],
 'visserie':['VISSERIE','Commun','Visserie diverse',68,'check'],

 'sangles':['SANGLES','Commun','Sangles',12,'ok'],

};
function defaults(){var out=[];Object.keys(BOX_META).forEach(function(id){var m=BOX_META[id];out.push({id:id,title:m[0],pilot:m[1],items:[{name:m[2],qty:m[3],status:m[4],ref:'',notes:'',photo:''}]});});return out;}
function load(){try{var s=frame.contentWindow.localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return defaults();}
function save(data){try{frame.contentWindow.localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){return false;}}
function getBox(data,id){for(var i=0;i<data.length;i++)if(data[i].id===id)return data[i];return null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function statusLabel(s){return s==='ok'?'OK':s==='check'?'À contrôler':'À remplacer';}
function addStyles(d){if(d.getElementById('v108styles'))return;var st=d.createElement('style');st.id='v108styles';st.textContent=`
.v108-badge{display:inline-flex;align-items:center;gap:4px;border:1px solid #3e494f;border-radius:999px;padding:4px 7px;margin-left:6px;color:#b7c0c5;font-size:10px;vertical-align:middle}
.v108-assist{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:9px}.v108-notes{width:100%;min-height:68px;resize:vertical;background:#0c1216;color:#fff;border:1px solid #3e4a51;border-radius:9px;padding:9px}.v108-actions{display:flex;gap:7px;flex-wrap:wrap;align-content:start}.v108-photo-label{position:relative;overflow:hidden}.v108-photo-label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.v108-preview{display:none;gap:9px;align-items:center;margin-top:8px;padding:8px;background:#0b1115;border:1px solid #334047;border-radius:10px}.v108-preview.on{display:flex}.v108-preview img{width:86px;height:64px;object-fit:cover;border-radius:7px;border:1px solid #53606a}.v108-preview small{color:#aab4ba}.v108-listening{border-color:#e3282c!important;box-shadow:0 0 0 2px rgba(227,40,44,.22)!important}
.v108-name{display:flex;align-items:center;gap:8px}.v108-thumb{width:44px;height:34px;object-fit:cover;border-radius:6px;border:1px solid #3d484e;background:#080b0d}.v108-none{display:grid;place-items:center;width:44px;height:34px;border:1px dashed #435058;border-radius:6px;color:#738087;font-size:10px}.v108-actions-cell{display:flex;gap:6px;flex-wrap:wrap}.v108-mini{padding:6px 8px!important;font-size:11px!important}
#v108Detail{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px}#v108Detail.open{display:flex}#v108Detail .v108-modal{width:min(860px,100%);max-height:92vh;overflow:auto;background:#11181d;border:1px solid #3c474e;border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,.55)}#v108Detail .v108-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #333e45}#v108Detail .v108-head h2{margin:0;font-size:22px}#v108Detail .v108-head span{color:#e3282c}#v108Detail .v108-close{border:0;background:transparent;color:white;font-size:28px}#v108Detail .v108-body{padding:16px;display:grid;grid-template-columns:280px 1fr;gap:16px}.v108-photo-box{min-height:220px;display:grid;place-items:center;border:1px solid #354047;background:#090e12;border-radius:12px;overflow:hidden}.v108-photo-box img{width:100%;height:100%;max-height:360px;object-fit:contain}.v108-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.v108-field{padding:10px 11px;background:#0c1216;border:1px solid #303a40;border-radius:9px}.v108-field small{display:block;color:#8f9aa1;font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.v108-field strong{display:block}.v108-field.full{grid-column:1/-1}.v108-notetext{white-space:pre-wrap;font-weight:400!important;color:#d9dfe2}.v108-invthumb{width:42px;height:32px;object-fit:cover;border-radius:5px;border:1px solid #3d484e}
@media(max-width:760px){.v108-assist{grid-template-columns:1fr}#v108Detail .v108-body{grid-template-columns:1fr}.v108-fields{grid-template-columns:1fr}.v108-field.full{grid-column:auto}}
`;d.head.appendChild(st);}
function updateVersion(d){d.title='ROAD TO P1 Garage — V1.0.8';var ver=d.querySelector('.version');if(ver)ver.textContent='V1.0.8';var p=d.querySelector('.title p');if(p&&!p.querySelector('.v108-badge'))p.insertAdjacentHTML('beforeend',' <span class="v108-badge">📷 Photo</span><span class="v108-badge">🎤 Dictée</span>');var foot=d.querySelector('.footer > div:first-child');if(foot)foot.innerHTML='ROAD TO P1 GARAGE &nbsp; V1.0.8';}
function ensureDetail(d){if(d.getElementById('v108Detail'))return;var el=d.createElement('div');el.id='v108Detail';el.innerHTML='<div class="v108-modal"><div class="v108-head"><h2>FICHE <span>ARTICLE</span></h2><button type="button" class="v108-close" aria-label="Fermer">×</button></div><div class="v108-body"><div class="v108-photo-box" id="v108DetailPhoto"></div><div class="v108-fields" id="v108DetailFields"></div></div></div>';d.body.appendChild(el);el.querySelector('.v108-close').addEventListener('click',function(){el.classList.remove('open');});el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('open');});}
function enhanceEditors(d){var editors=d.querySelectorAll('[data-box-editor]');for(var i=0;i<editors.length;i++){var ed=editors[i];if(ed.getAttribute('data-v108'))continue;ed.setAttribute('data-v108','1');var id=ed.getAttribute('data-box-editor');var panel=d.createElement('div');panel.className='v108-assist';panel.innerHTML='<textarea class="v108-notes" name="notes" placeholder="Notes, emplacement, détails…"></textarea><div class="v108-actions"><label class="btn v108-photo-label">📷 Photo<input type="file" accept="image/*" capture="environment" data-v108-photo="'+esc(id)+'"></label><button type="button" class="btn" data-v108-voice="name">🎤 Dicter article</button><button type="button" class="btn" data-v108-voice="ref">🎤 Dicter réf.</button><button type="button" class="btn danger v108-remove-photo" style="display:none">Retirer photo</button></div><div class="v108-preview"><img alt="Aperçu"><small>Photo prête à être enregistrée.</small></div>';var saveRow=ed.querySelector('.save-row');ed.insertBefore(panel,saveRow);ed._v108photo='';}}
function compress(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var max=1000,w=img.width,h=img.height;if(w>max||h>max){var ratio=Math.min(max/w,max/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',.72));};img.onerror=function(){cb(String(r.result||''));};img.src=r.result;};r.onerror=function(){cb('');};r.readAsDataURL(file);}
function renderBoxes(d){var data=load();for(var bi=0;bi<data.length;bi++){var b=data[bi],wrap=d.querySelector('[data-items-wrap="'+b.id+'"]');if(!wrap)continue;var rows='';for(var i=0;i<b.items.length;i++){var it=b.items[i];var ph=it.photo?'<img class="v108-thumb" src="'+it.photo+'" alt="">':'<span class="v108-none">—</span>';rows+='<tr><td><div class="v108-name">'+ph+'<span>'+esc(it.name)+'</span></div></td><td>'+esc(it.ref||'—')+'</td><td class="qty">'+Number(it.qty||0)+'</td><td><select class="inline-status" data-box-status="'+b.id+'" data-idx="'+i+'"><option value="ok"'+(it.status==='ok'?' selected':'')+'>OK</option><option value="check"'+(it.status==='check'?' selected':'')+'>À contrôler</option><option value="replace"'+(it.status==='replace'?' selected':'')+'>À remplacer</option></select></td><td><div class="v108-actions-cell"><button type="button" class="btn v108-mini" data-v108-detail="'+b.id+'" data-idx="'+i+'">Fiche</button><button type="button" class="btn danger v108-mini" data-box-delete="'+b.id+'" data-idx="'+i+'">Suppr.</button></div></td></tr>';}
wrap.innerHTML=b.items.length?'<table class="items"><thead><tr><th>Article</th><th>Référence</th><th>Qté</th><th>État</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="notice">Cette boîte est vide.</div>';}}
function renderInventory(d){var body=d.getElementById('inventoryBody');if(!body)return;var boxEl=d.getElementById('inventoryBox'),artEl=d.getElementById('inventoryArticle'),refEl=d.getElementById('inventoryRef'),pilotEl=d.getElementById('inventoryPilot');if(!boxEl||!artEl||!refEl||!pilotEl)return;var boxId=boxEl.value,article=String(artEl.value||'').toLowerCase(),ref=String(refEl.value||'').toLowerCase(),pilot=pilotEl.value,data=load(),rows='',n=0;for(var bi=0;bi<data.length;bi++){var b=data[bi];for(var i=0;i<b.items.length;i++){var it=b.items[i];if(boxId!=='all'&&boxId!==b.id)continue;if(pilot!=='all'&&pilot!==b.pilot)continue;if(article&&String(it.name||'').toLowerCase().indexOf(article)<0)continue;if(ref&&String(it.ref||'').toLowerCase().indexOf(ref)<0)continue;var ph=it.photo?'<img class="v108-invthumb" src="'+it.photo+'" alt="">':'—';rows+='<tr><td>'+esc(b.title)+'</td><td>'+ph+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.ref||'—')+'</td><td class="qtycell">'+Number(it.qty||0)+'</td><td>'+statusLabel(it.status)+'</td><td><button type="button" class="btn v108-mini" data-v108-detail="'+b.id+'" data-idx="'+i+'">Ouvrir</button></td></tr>';n++;}}
var head=body.closest('table').querySelector('thead tr');if(head)head.innerHTML='<th>Boîte</th><th>Photo</th><th>Article</th><th>Référence</th><th>Qté</th><th>État</th><th>Fiche</th>';body.innerHTML=rows;var empty=d.getElementById('inventoryEmpty');if(empty)empty.style.display=n?'none':'block';}
function showDetail(d,id,idx){var data=load(),b=getBox(data,id);if(!b||!b.items[idx])return;var it=b.items[idx],ov=d.getElementById('v108Detail'),photo=d.getElementById('v108DetailPhoto'),fields=d.getElementById('v108DetailFields');photo.innerHTML=it.photo?'<img src="'+it.photo+'" alt="Photo de l\'article">':'<span style="color:#76838a">Aucune photo</span>';fields.innerHTML='<div class="v108-field"><small>Boîte</small><strong>'+esc(b.title)+'</strong></div><div class="v108-field"><small>Pilote</small><strong>'+esc(b.pilot)+'</strong></div><div class="v108-field"><small>Article</small><strong>'+esc(it.name)+'</strong></div><div class="v108-field"><small>Référence</small><strong>'+esc(it.ref||'—')+'</strong></div><div class="v108-field"><small>Quantité</small><strong>'+Number(it.qty||0)+'</strong></div><div class="v108-field"><small>État</small><strong>'+esc(statusLabel(it.status))+'</strong></div><div class="v108-field full"><small>Notes / emplacement / détails</small><strong class="v108-notetext">'+esc(it.notes||'—')+'</strong></div>';ov.classList.add('open');}
function csvDownload(d,rows,name){var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(';');}).join('\n');var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var a=d.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;d.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},800);}
function saveEnhanced(d,id,btn){var ed=btn.closest('[data-box-editor]');if(!ed)return;var name=String((ed.querySelector('[name="name"]')||{}).value||'').trim();if(!name){var n=ed.querySelector('[name="name"]');if(n)n.focus();var fb=ed.querySelector('.save-feedback');if(fb){fb.style.color='#ff8c91';fb.textContent='Indique le nom de l’article.';}return;}var qty=Math.max(1,parseInt((ed.querySelector('[name="qty"]')||{}).value||'1',10)||1),status=(ed.querySelector('[name="status"]')||{}).value||'ok',ref=String((ed.querySelector('[name="ref"]')||{}).value||'').trim(),notes=String((ed.querySelector('[name="notes"]')||{}).value||'').trim(),data=load(),b=getBox(data,id);if(!b)return;b.items.push({name:name,qty:qty,status:status,ref:ref,notes:notes,photo:ed._v108photo||''});if(!save(data)){alert('Impossible d’enregistrer : espace de stockage du navigateur insuffisant. Essaie avec une photo plus légère.');return;}var hash='#box-'+id;frame.onload=function(){frame.onload=null;patch();try{frame.contentWindow.location.hash=hash;}catch(e){}};frame.contentWindow.location.reload();}
function voice(d,btn){var ed=btn.closest('[data-box-editor]'),targetName=btn.getAttribute('data-v108-voice'),target=ed&&ed.querySelector('[name="'+targetName+'"]');if(!target)return;var w=frame.contentWindow,SR=w.SpeechRecognition||w.webkitSpeechRecognition||window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('La reconnaissance vocale n’est pas disponible dans ce navigateur. Utilise Chrome récent sur Android.');return;}var rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;btn.classList.add('v108-listening');btn.textContent='🎤 Écoute…';rec.onresult=function(ev){var text=ev.results&&ev.results[0]&&ev.results[0][0]?ev.results[0][0].transcript:'';if(text)target.value=text;};rec.onerror=function(){alert('La dictée n’a pas pu démarrer. Vérifie l’autorisation du microphone.');};rec.onend=function(){btn.classList.remove('v108-listening');btn.textContent=targetName==='name'?'🎤 Dicter article':'🎤 Dicter réf.';};try{rec.start();}catch(e){btn.classList.remove('v108-listening');}}
function wire(d){if(d.documentElement.getAttribute('data-v108-wired'))return;d.documentElement.setAttribute('data-v108-wired','1');d.addEventListener('click',function(e){var saveBtn=e.target.closest&&e.target.closest('[data-box-editor] .save-row button');if(saveBtn){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();var ed=saveBtn.closest('[data-box-editor]');saveEnhanced(d,ed.getAttribute('data-box-editor'),saveBtn);return;}var voiceBtn=e.target.closest&&e.target.closest('[data-v108-voice]');if(voiceBtn){e.preventDefault();voice(d,voiceBtn);return;}var rem=e.target.closest&&e.target.closest('.v108-remove-photo');if(rem){var ed2=rem.closest('[data-box-editor]');ed2._v108photo='';rem.style.display='none';var prev=ed2.querySelector('.v108-preview');prev.classList.remove('on');prev.querySelector('img').removeAttribute('src');return;}var det=e.target.closest&&e.target.closest('[data-v108-detail]');if(det){e.preventDefault();showDetail(d,det.getAttribute('data-v108-detail'),Number(det.getAttribute('data-idx')));return;}if(e.target.closest&&e.target.closest('#exportAllBtn')){e.preventDefault();e.stopPropagation();var rows=[['Boîte','Pilote','Article','Référence','Quantité','État','Notes','Photo']],data=load();data.forEach(function(b){b.items.forEach(function(it){rows.push([b.title,b.pilot,it.name,it.ref||'',it.qty,statusLabel(it.status),it.notes||'',it.photo?'Oui':'Non']);});});csvDownload(d,rows,'road-to-p1-garage_inventaire_v108.csv');return;}var ex=e.target.closest&&e.target.closest('.export-box');if(ex){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();var id=ex.getAttribute('data-box'),data2=load(),b2=getBox(data2,id),rows2=[['Boîte','Article','Référence','Quantité','État','Notes','Photo']];if(b2)b2.items.forEach(function(it){rows2.push([b2.title,it.name,it.ref||'',it.qty,statusLabel(it.status),it.notes||'',it.photo?'Oui':'Non']);});csvDownload(d,rows2,'road-to-p1-garage_'+id+'_v108.csv');return;}setTimeout(function(){renderBoxes(d);renderInventory(d);},25);},true);
d.addEventListener('change',function(e){var inp=e.target;if(inp&&inp.hasAttribute('data-v108-photo')){var ed=inp.closest('[data-box-editor]'),file=inp.files&&inp.files[0];if(!ed||!file)return;compress(file,function(url){ed._v108photo=url;var prev=ed.querySelector('.v108-preview');prev.classList.add('on');prev.querySelector('img').src=url;ed.querySelector('.v108-remove-photo').style.display='inline-block';});return;}setTimeout(function(){renderBoxes(d);renderInventory(d);},25);},true);d.addEventListener('input',function(e){if(e.target&&(['inventoryArticle','inventoryRef'].indexOf(e.target.id)>=0))setTimeout(function(){renderInventory(d);},0);},true);}
function patch(){var d;try{d=frame.contentDocument;if(!d||!d.body)return;}catch(e){return;}boot.style.display='none';addStyles(d);updateVersion(d);ensureDetail(d);enhanceEditors(d);wire(d);renderBoxes(d);renderInventory(d);}
frame.addEventListener('load',patch);
})();
</script>
